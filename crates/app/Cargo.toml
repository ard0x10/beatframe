[package]
name = "app"
version = "0.1.2"
edition.workspace = true
license.workspace = true

[[bin]]
name = "beatframe"
path = "src/main.rs"

[dependencies]
analysis = { path = "../analysis" }
capture = { path = "../capture" }
wgpu = "30"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
tray-icon = "0.25.1"
notify = "8.2.0"
global-hotkey = "0.8.0"
egui = { version = "0.36.2", default-features = false }
egui-winit = { version = "0.36.2", default-features = false }
egui-wgpu = { version = "0.36.2", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Graphics_Imaging", "Media_Control", "Storage_Streams"] }
windows-sys = { version = "0.61", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }
